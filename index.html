<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew Readiness Check · Crew dashboard</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --night: #0a1a2f;
    --night-deep: #06111f;
    --panel: #10223a;
    --panel-hi: #163050;
    --line: #2a4466;
    --text: #eef3fa;
    --muted: #8fa6c4;
    --earthlight: #7dd3fc;
    --led: #ffb020;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --font: "Avenir Next", "Avenir", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-num: "Avenir Next Condensed", "Avenir Next", "Arial Narrow", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--night-deep); }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--font); color: var(--text); font-size: 18px; line-height: 1.45;
    background:
      radial-gradient(140% 60% at 50% 128%, rgba(125, 211, 252, 0.26) 0%, rgba(56, 120, 190, 0.16) 38%, rgba(10, 26, 47, 0) 62%),
      linear-gradient(180deg, var(--night-deep) 0%, var(--night) 70%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  body::after {
    content: ""; position: fixed; left: -20%; right: -20%; bottom: -78vh; height: 90vh;
    border-radius: 50%; border-top: 2px solid rgba(125, 211, 252, 0.5);
    box-shadow: 0 -10px 60px rgba(125, 211, 252, 0.16);
    pointer-events: none; z-index: 0;
  }
  a { color: var(--earthlight); }
  :focus-visible { outline: 3px solid var(--earthlight); outline-offset: 3px; }

  .topbar {
    position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 24px;
    padding: 18px 36px; border-bottom: 1px solid rgba(42, 68, 102, 0.7);
    background: rgba(6, 17, 31, 0.55); backdrop-filter: blur(6px);
  }
  .product { display: flex; align-items: center; gap: 14px; }
  .emblem { width: 38px; height: 38px; flex: none; }
  .product-name { font-weight: 700; font-size: 21px; line-height: 1.1; }
  .product-sub { color: var(--muted); font-size: 15px; }
  .event { text-align: right; font-size: 14px; color: var(--muted); line-height: 1.35; }
  .event strong { color: var(--text); font-weight: 600; }
  .event a { font-size: 15px; text-decoration: none; }

  main { position: relative; z-index: 2; max-width: 1280px; margin: 0 auto; padding: 26px 32px 120px; }

  /* ---------- Mission header ---------- */
  .mission-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 18px; }
  .mission-head h1 { font-size: 40px; line-height: 1.08; margin: 0; font-weight: 700; }
  .mission-head p { margin: 6px 0 0; color: var(--muted); font-size: 18px; }
  .mission-head p b { color: var(--text); font-weight: 600; }
  .head-tools { display: flex; gap: 10px; align-items: center; }

  /* ---------- Crew poll board (the signature element) ---------- */
  .poll {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px;
    padding: 16px; border-radius: 22px; margin-bottom: 18px;
    background: rgba(6, 17, 31, 0.6); border: 1px solid var(--line);
  }
  .poll button {
    position: relative; text-align: left; cursor: pointer; font-family: var(--font); color: var(--text);
    background: rgba(16, 34, 58, 0.9); border: 1.5px solid transparent; border-radius: 14px;
    padding: 12px 12px 14px; min-height: 132px; display: flex; flex-direction: column; gap: 6px;
  }
  .poll button:hover { border-color: rgba(125, 211, 252, 0.4); }
  .poll button.selected { border-color: var(--earthlight); background: rgba(22, 48, 80, 0.95); }
  .poll .row1 { display: flex; justify-content: space-between; align-items: flex-start; }
  .poll .num { font-family: var(--font-num); font-size: 30px; font-weight: 600; line-height: 1; color: var(--muted); }
  .poll .lamp { width: 22px; height: 22px; border-radius: 50%; box-shadow: 0 0 14px var(--glow); background: var(--c); }
  .poll .word { font-family: var(--font-num); font-weight: 700; font-size: 22px; color: var(--c); line-height: 1.05; margin-top: auto; }
  .poll .pname { font-size: 24px; font-weight: 700; line-height: 1.1; }
  .poll .role { font-size: 14px; color: var(--muted); line-height: 1.2; }
  .poll .flags { display: flex; gap: 6px; min-height: 18px; }
  .tag { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; line-height: 1.5; }
  .tag.live { background: var(--earthlight); color: var(--night-deep); }
  .tag.bio { background: rgba(234, 179, 8, 0.18); color: #fde68a; border: 1px solid rgba(234, 179, 8, 0.6); }
  .tag.bio.high { background: rgba(239, 68, 68, 0.18); color: #fecaca; border-color: rgba(239, 68, 68, 0.7); }
    .slept { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .slept.short { color: #fde68a; }

  /* ---------- EVA pick ---------- */
  .eva {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 14px 20px; border-radius: 16px; margin-bottom: 26px;
    border: 1.5px dashed rgba(125, 211, 252, 0.45);
  }
  .eva .label { font-weight: 600; }
  .eva .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px; background: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.5); font-size: 15px; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--green); display: inline-block; }
  .eva .count { color: var(--muted); font-size: 15px; margin-left: auto; }

  /* ---------- Detail ---------- */
  .detail { display: grid; grid-template-columns: 1.1fr 1fr; gap: 22px; }
  .panel {
    background: linear-gradient(180deg, rgba(22, 48, 80, 0.85), rgba(16, 34, 58, 0.85));
    border: 1px solid var(--line); border-radius: 18px; padding: 24px 26px;
  }
  .panel h2 { font-size: 21px; margin: 0 0 4px; font-weight: 600; }
  .panel .sub { color: var(--muted); font-size: 15px; margin: 0 0 16px; }
  .span2 { grid-column: 1 / -1; }

  .verdict { display: grid; grid-template-columns: 170px 1fr; gap: 26px; align-items: center; }
  .ring {
    width: 170px; height: 170px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(circle at 50% 50%, rgba(6, 17, 31, 1) 57%, transparent 58%), var(--c);
    box-shadow: 0 0 0 8px rgba(6, 17, 31, 0.6), 0 0 56px var(--glow);
  }
  .ring span { font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1.02; color: var(--c); padding: 0 16px; }
  .who-name { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .who-role { color: var(--muted); font-size: 16px; margin: 2px 0 10px; }
  .source { font-size: 14.5px; color: var(--muted); }
  .source .tag { margin-right: 6px; }
  .escalation { margin-top: 10px; font-size: 17px; font-weight: 600; }

  .figures { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 22px; margin: 22px 0 4px; justify-content: start; }
  .figure .v { font-family: var(--font-num); font-size: 32px; font-weight: 600; line-height: 1.05; }
  .figure .k { color: var(--muted); font-size: 14px; }
  .figure .s { color: var(--muted); font-size: 13.5px; }

  .alerts { margin-top: 18px; }
  .alert {
    display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;
    border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; font-size: 16.5px; font-weight: 600;
    background: rgba(6, 17, 31, 0.5); border: 1px solid var(--line);
  }
  .alert svg { width: 22px; height: 22px; margin-top: 1px; }
  .alert.mismatch { border-color: rgba(239, 68, 68, 0.7); background: rgba(239, 68, 68, 0.10); }
  .alert.predict { border-color: rgba(234, 179, 8, 0.7); background: rgba(234, 179, 8, 0.08); }
  .alert.surgeon { border-color: rgba(125, 211, 252, 0.7); background: rgba(125, 211, 252, 0.08); }

  ul.guidance { list-style: none; margin: 4px 0 0; padding: 0; }
  ul.guidance li { position: relative; padding: 8px 0 8px 34px; font-size: 17.5px; border-bottom: 1px solid rgba(42, 68, 102, 0.6); }
  ul.guidance li:last-child { border-bottom: none; }
  ul.guidance li::before { content: ""; position: absolute; left: 2px; top: 13px; width: 17px; height: 17px; border-radius: 5px; border: 2px solid var(--c); }
  .self-test-btn { margin-top: 16px; }

  /* ---------- Biometrics ---------- */
  .bio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bio {
    text-align: left; font-family: var(--font); color: var(--text); cursor: pointer;
    background: rgba(6, 17, 31, 0.45); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px;
  }
  .bio:hover { border-color: rgba(125, 211, 252, 0.45); }
  .bio.open { border-color: var(--earthlight); }
  .bio .top { display: flex; justify-content: space-between; align-items: center; }
  .bio .name { color: var(--muted); font-size: 14.5px; }
  .bio .state { font-size: 13px; font-weight: 700; }
  .bio .state.ok { color: var(--green); }
  .bio .state.warn { color: #fde68a; }
  .bio .state.bad { color: #fca5a5; }
  .bio .val { font-family: var(--font-num); font-size: 30px; font-weight: 600; line-height: 1.1; }
  .bio .val small { font-size: 16px; color: var(--muted); font-family: var(--font); font-weight: 400; margin-left: 4px; }
  .bio svg { display: block; width: 100%; height: 40px; margin-top: 4px; }
  .bio-explain { margin-top: 12px; color: var(--muted); font-size: 15.5px; min-height: 46px; }
  .bio-explain b { color: var(--text); }
  .row-mood { display: flex; gap: 26px; margin-top: 16px; flex-wrap: wrap; }

  /* ---------- Charts ---------- */
  .chart svg { display: block; width: 100%; height: auto; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 14px; margin-top: 8px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .axis { fill: #6f86a6; font-size: 12px; font-family: var(--font); }

  .btn {
    display: inline-block; border: none; border-radius: 999px; cursor: pointer; text-decoration: none;
    font-family: var(--font); font-weight: 700; font-size: 17px; line-height: 1;
    padding: 14px 24px; background: var(--text); color: var(--night-deep);
  }
  .btn:hover { background: #fff; }
  .btn.quiet { background: transparent; color: var(--text); border: 1.5px solid var(--line); }
  .btn.quiet:hover { border-color: var(--earthlight); }
  .btn.small { font-size: 15px; padding: 10px 16px; }

  .error-box { padding: 24px; border: 1.5px solid rgba(239, 68, 68, 0.6); border-radius: 16px; background: rgba(239, 68, 68, 0.08); font-size: 18px; }

  footer {
    position: fixed; z-index: 3; left: 0; right: 0; bottom: 0; padding: 10px 24px; text-align: center;
    font-size: 14px; color: var(--muted); background: rgba(6, 17, 31, 0.82); border-top: 1px solid rgba(42, 68, 102, 0.7);
  }

  @media (max-width: 1100px) {
    .poll { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .detail { grid-template-columns: 1fr; }
    .figures { grid-template-columns: repeat(3, auto); }
  }
  @media (max-width: 640px) {
    main { padding: 18px 16px 120px; }
    .topbar { flex-direction: column; align-items: flex-start; padding: 14px 18px; }
    .event { text-align: left; }
    .poll { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .verdict { grid-template-columns: 1fr; }
    .bio-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

ise_min":76,"test":{"mean_rt_ms":252,"lapses":0,"false_starts":1},"sleepiness":2,"mood":4},{"day":25,"phase":"inflight","sleep_h":6.7,"hr_bpm":67,"spo2":98,"temp_c":36.6,"bp_sys":112,"bp_dia":73,"exercise_min":74,"test":{"mean_rt_ms":252,"lapses":0,"false_starts":2},"sleepiness":3,"mood":4},{"day":26,"phase":"inflight","sleep_h":6.5,"hr_bpm":66,"spo2":97,"temp_c":36.6,"bp_sys":111,"bp_dia":73,"exercise_min":36,"test":{"mean_rt_ms":250,"lapses":0,"false_starts":0},"sleepiness":2,"mood":4},{"day":27,"phase":"inflight","sleep_h":6.1,"hr_bpm":64,"spo2":98,"temp_c":36.6,"bp_sys":118,"bp_dia":74,"exercise_min":33,"test":{"mean_rt_ms":243,"lapses":0,"false_starts":1},"sleepiness":4,"mood":3},{"day":28,"phase":"inflight","sleep_h":6.7,"hr_bpm":65,"spo2":98,"temp_c":36.7,"bp_sys":142,"bp_dia":92,"exercise_min":42,"test":{"mean_rt_ms":253,"lapses":1,"false_starts":0},"sleepiness":4,"mood":4},{"day":29,"phase":"inflight","sleep_h":6.7,"hr_bpm":61,"spo2":98,"temp_c":36.8,"bp_sys":144,"bp_dia":93,"exercise_min":69,"test":{"mean_rt_ms":241,"lapses":0,"false_starts":0},"sleepiness":3,"mood":4},{"day":30,"phase":"inflight","sleep_h":6.1,"hr_bpm":64,"spo2":97,"temp_c":36.7,"bp_sys":145,"bp_dia":94,"exercise_min":32,"test":{"mean_rt_ms":241,"lapses":0,"false_starts":0},"sleepiness":5,"mood":4}]}]}</script>
<script>
(function () {
  "use strict";
  function embedded() {
    try { var el = document.getElementById("crew-embedded"); return el ? JSON.parse(el.textContent) : null; } catch (e) { return null; }
  }

  var COLORS = { GREEN: "#22c55e", YELLOW: "#eab308", RED: "#ef4444" };
  var WORD = { GREEN: "READY", YELLOW: "CAUTION", RED: "NOT READY" };
  var ESCALATION = {
    GREEN: "Available for critical tasks",
    YELLOW: "Commander notified. Critical tasks only with a crewmate double-check.",
    RED: "Reassign critical task. Retest in 4 hours."
  };
  var GUIDANCE = {
    GREEN: ["You are cleared for critical tasks today.", "Keep your sleep schedule consistent tonight."],
    YELLOW: ["Ask a crewmate to double-check critical steps.", "Take a 20–26 minute nap before your next critical task, if possible.", "Retest before the task."],
    RED: ["Hand over today's critical task to a crewmate.", "Prioritize sleep: aim for a full sleep period tonight.", "Retest in 4 hours."]
  };
  var EXPLAIN = {
    hr: "<b>Heart rate:</b> How many times your heart beats per minute at rest. It can rise with fatigue, stress, dehydration or illness.",
    spo2: "<b>SpO₂:</b> How much oxygen your blood is carrying. Single readings can be off by a few percent, so the trend matters more than one value.",
    temp: "<b>Temperature:</b> Your core body temperature. A rise can be an early sign of infection.",
    bp: "<b>Blood pressure:</b> The force of blood on your artery walls. Readings of 140/90 or higher are classed as high.",
    rt: "<b>Reaction time:</b> How fast you respond to a signal. It slows down when you are tired, often before you notice it yourself.",
    lapses: "<b>Lapses:</b> Responses slower than 355 ms, moments when your attention briefly drops. More lapses mean higher fatigue.",
    sleepiness: "<b>Sleepiness (1–9):</b> How sleepy you feel right now. We compare it with your test to catch hidden fatigue.",
    mood: "<b>Mood (1–5):</b> How you feel today. Long missions in isolation can affect mood, so we track it over time."
  };
  var MOODS = ["😞", "🙁", "😐", "🙂", "😄"];
  var ICON_WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v4.5"/><path d="M12 17.5h.01"/></svg>';
  var ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
  var ICON_EARTH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3.2 3 14.8 0 18"/><path d="M12 3c-3 3.2-3 14.8 0 18"/></svg>';

  var raw = null;          // crew.json as loaded
  var model = null;        // derived per astronaut
  var selectedId = null;
  var openBio = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmtSleep(h) { if (h == null) return "n/a"; var t = Math.round(h * 60); return Math.floor(t / 60) + " h " + (t % 60) + " min"; }

  // ---------- Rules ----------
  function classify(test, baseline) {
    if (!test || test.mean_rt_ms == null) return { color: "RED", diff: null };
    var diff = (test.mean_rt_ms - baseline.mean_rt_ms) / baseline.mean_rt_ms * 100;
    var color = (diff > 20 || test.lapses >= 4) ? "RED" : (diff > 10 || test.lapses >= 2) ? "YELLOW" : "GREEN";
    return { color: color, diff: diff };
  }
  function bioFlags(d) {
    var hr = (d.hr_bpm >= 55 && d.hr_bpm <= 100) ? "ok" : "warn";
    var spo2 = d.spo2 >= 95 ? "ok" : (d.spo2 >= 93 ? "warn" : "bad");
    var temp = (d.temp_c >= 36.1 && d.temp_c <= 37.2) ? "ok" : "warn";
    var bp = (d.bp_sys >= 140 || d.bp_dia >= 90) ? "bad" : (d.bp_sys >= 120 || d.bp_dia >= 80) ? "warn" : "ok";
    return { hr: hr, spo2: spo2, temp: temp, bp: bp };
  }
  var BIO_LABEL = {
    hr: { ok: "Normal", warn: "Check" },
    spo2: { ok: "Normal", warn: "Recheck", bad: "Low" },
    temp: { ok: "Normal", warn: "Check" },
    bp: { ok: "Normal", warn: "Elevated", bad: "High" }
  };
  var BIO_NAME = { hr: "Heart rate", spo2: "SpO₂", temp: "Temperature", bp: "Blood pressure" };
  var BIO_SHORT = { hr: "HR", spo2: "SpO₂", temp: "Temp", bp: "BP" };

  // ---------- Live results from the self-test ----------
  function readLive(id) {
    try {
      var v = localStorage.getItem("selftest_" + id);
      if (!v) return null;
      var o = JSON.parse(v);
      if (o && typeof o === "object" && "lapses" in o) return o;
    } catch (e) { /* ignore */ }
    return null;
  }
  function resetLive() {
    try { for (var i = 1; i <= 10; i++) localStorage.removeItem("selftest_" + i); } catch (e) { /* ignore */ }
    build(); render();
  }

  // ---------- Model ----------
  function build() {
    var today = raw.mission.current_day;
    model = raw.astronauts.map(function (a) {
      var days = a.days.map(function (d) { return JSON.parse(JSON.stringify(d)); });
      var byDay = {};
      days.forEach(function (d) { byDay[d.day] = d; });
      var live = readLive(a.id);
      var t = byDay[today];
      if (live && t) {
        t.test = { mean_rt_ms: live.mean_rt_ms, lapses: live.lapses, false_starts: live.false_starts };
        if (live.sleepiness != null) t.sleepiness = live.sleepiness;
        if (live.mood != null) t.mood = live.mood;
      }
      days.forEach(function (d) { var c = classify(d.test, a.baseline); d._color = c.color; d._diff = c.diff; d._bio = bioFlags(d); });
      var last3 = [today - 2, today - 1, today].map(function (k) { return byDay[k]; });
      var red3 = last3.every(function (d) { return d && d._color === "RED"; });
      var bio3 = [];
      ["hr", "spo2", "temp", "bp"].forEach(function (k) {
        if (last3.every(function (d) { return d && d._bio[k] !== "ok"; })) bio3.push(k);
      });
      var tb = t._bio;
      var bioIssue = ["hr", "spo2", "temp", "bp"].filter(function (k) { return tb[k] !== "ok"; });
      return {
        a: a, days: days, byDay: byDay, today: t, live: live, red3: red3, bio3: bio3, bioIssue: bioIssue,
        color: t._color,
        mismatch: t.sleepiness <= 3 && (t._color === "YELLOW" || t._color === "RED"),
        predict: last3.every(function (d) { return d && d.sleep_h < 6; })
      };
    });
    var rank = { RED: 0, YELLOW: 1, GREEN: 2 };
    model.sort(function (x, y) { return rank[x.color] - rank[y.color] || x.a.id - y.a.id; });
    if (selectedId == null || !model.some(function (m) { return m.a.id === selectedId; })) selectedId = model[0].a.id;
  }

  // ---------- Render ----------
  function render() {
    var m = raw.mission, task = m.next_critical_task;
    var recommended = model.filter(function (x) { return x.color === "GREEN" && x.bioIssue.length === 0; })
      .sort(function (p, q) { return p.a.id - q.a.id; });
    var anyLive = model.some(function (x) { return x.live; });

    var html = "";
    html += '<div class="mission-head"><div><h1>Crew readiness, mission day ' + m.current_day + '</h1>' +
      '<p>Next critical task: <b>' + esc(task ? task.name + ", day " + task.day + " at " + task.time : "none scheduled") + '</b>. ' +
      'Colors come from each astronaut’s reaction test against their own baseline.</p></div>' +
      '<div class="head-tools">' + (anyLive ? '<button class="btn quiet small" id="btn-reset">Reset live results</button>' : '') + '</div></div>';

    html += '<div class="poll" role="list">';
    model.forEach(function (x) {
      var c = COLORS[x.color];
      var high = x.bioIssue.some(function (k) { return x.today._bio[k] === "bad"; });
      html += '<button role="listitem" data-id="' + x.a.id + '" class="' + (x.a.id === selectedId ? "selected" : "") + '" ' +
        'style="--c:' + c + ';--glow:' + c + '66" aria-label="' + esc(x.a.name + ", " + WORD[x.color]) + '">' +
        '<div class="row1"><span class="num">' + x.a.id + '</span><span class="lamp"></span></div>' +
        '<div class="pname">' + esc(x.a.name) + '</div><div class="role">' + esc(x.a.role) + '</div>' +
                '<div class="slept' + (x.today.sleep_h < 6 ? ' short' : '') + '">☾ ' + fmtSleep(x.today.sleep_h) + ' slept</div>' +
        '<div class="flags">' + (x.live ? '<span class="tag live">LIVE</span>' : '') +
        (x.bioIssue.length ? '<span class="tag bio' + (high ? " high" : "") + '">⚠ ' + esc(BIO_SHORT[x.bioIssue[0]]) + '</span>' : '') + '</div>' +
        '<div class="word">' + WORD[x.color] + '</div></button>';
    });
    html += '</div>';

    html += '<div class="eva"><span class="label">Recommended for ' + esc(task ? task.name : "the next task") + ':</span><div class="chips">';
    recommended.forEach(function (x) { html += '<span class="chip"><i></i>' + esc(x.a.name) + '</span>'; });
    if (!recommended.length) html += '<span class="note">Nobody is fully cleared. Review the crew below.</span>';
    html += '</div><span class="count">' + recommended.length + ' of ' + model.length + ' cleared: ready and all vital signs normal</span></div>';

    html += '<div id="detail"></div>';
    $("app").innerHTML = html;

    var btns = document.querySelectorAll(".poll button");
    for (var i = 0; i < btns.length; i++) btns[i].addEventListener("click", function () {
      selectedId = parseInt(this.getAttribute("data-id"), 10); openBio = null; render();
    });
    if ($("btn-reset")) $("btn-reset").addEventListener("click", resetLive);
    renderDetail();
  }

  function renderDetail() {
    var x = model.filter(function (m) { return m.a.id === selectedId; })[0];
    var t = x.today, c = COLORS[x.color];
    var diffTxt = t._diff == null ? "no valid responses" : (Math.round(t._diff) > 0 ? "+" : "") + Math.round(t._diff) + "% vs baseline " + x.a.baseline.mean_rt_ms + " ms";
    var source = x.live
      ? '<span class="tag live">LIVE</span>Live result from self-test at ' + timeOf(x.live.timestamp)
      : "From the latest scheduled check, day " + raw.mission.current_day;

    var alerts = "";
    if (x.mismatch) alerts += alert("mismatch", ICON_WARN, "Reports feeling fine, but sleep and test data show fatigue.");
    if (x.predict) alerts += alert("predict", ICON_MOON, "Three short nights in a row: likely NOT READY tomorrow without more sleep.");
    if (x.red3) alerts += alert("surgeon", ICON_EARTH, "Report to flight surgeons at next comm window: NOT READY for 3 days.");
    x.bio3.forEach(function (k) {
      var lvl = BIO_LABEL[k][t._bio[k]];
      alerts += alert("surgeon", ICON_EARTH, "Report to flight surgeons at next comm window: " + BIO_NAME[k].toLowerCase().replace(/^./, function (s) { return s.toUpperCase(); }) + " " + lvl.toLowerCase() + " for 3 days.");
    });

    // Green reaction test but a vital sign outside the normal range: the readiness color
    // stays green (vitals never change it), but the person is NOT cleared, so say that.
    var vitalsHold = x.color === "GREEN" && x.bioIssue.length > 0;
    var flagged = x.bioIssue.map(function (k) { return BIO_NAME[k] + " (" + BIO_LABEL[k][t._bio[k]].toLowerCase() + ")"; });
    var many = flagged.length > 1;
    var guideItems = vitalsHold ? [
      "Reaction test is fine, but " + (many ? "vital signs are" : "a vital sign is") + " outside the normal range: " + flagged.join(", ") + ".",
      "Not cleared for critical tasks until " + (many ? "they are" : "it is") + " rechecked and reviewed.",
      "Report to flight surgeons at the next comm window if " + (many ? "they persist." : "it persists.")
    ] : GUIDANCE[x.color];
    var guide = guideItems.map(function (g) { return "<li>" + esc(g) + "</li>"; }).join("");

    var h = '<div class="detail" style="--c:' + c + ';--glow:' + c + '55">';
    // Left: verdict
    h += '<section class="panel"><div class="verdict">' +
      '<div class="ring"><span>' + WORD[x.color] + '</span></div>' +
      '<div><div class="who-name">' + esc(x.a.name) + '</div><div class="who-role">' + esc(x.a.role) + '</div>' +
      '<div class="source">' + source + '</div>' +
      '<div class="escalation" style="color:' + (vitalsHold ? COLORS.YELLOW : c) + '">' +
        esc(vitalsHold ? "Test ready, but " + (many ? "vital signs need" : "a vital sign needs") + " review. Not cleared for critical tasks yet." : ESCALATION[x.color]) + '</div></div></div>' +
      '<div class="figures">' +
        figure(t.test.mean_rt_ms == null ? "n/a" : t.test.mean_rt_ms + " ms", "Reaction time", diffTxt) +
        figure(t.test.lapses, "Lapses", "≥ 355 ms") +
        figure(fmtSleep(t.sleep_h), "Sleep last night", "from wearable") +
        figure(t.sleepiness + "/9", "Sleepiness", "self-reported") +
        figure(MOODS[(t.mood || 3) - 1], "Mood", t.mood + "/5") +
      '</div>' +
      (alerts ? '<div class="alerts">' + alerts + '</div>' : '') +
      '<ul class="guidance">' + guide + '</ul>' +
      '<a class="btn self-test-btn" href="selftest.html#a' + x.a.id + '-demo">Take self-test now</a>' +
      '</section>';

    // Right: biometrics
    h += '<section class="panel"><h2>Vital signs</h2><p class="sub">From the wearable. Shown separately: they do not change the readiness color.</p><div class="bio-grid">';
    ["hr", "spo2", "temp", "bp"].forEach(function (k) { h += bioTile(x, k); });
    h += '</div><div class="bio-explain" id="bio-explain">' + (openBio ? EXPLAIN[openBio] : "Select a vital sign to see what it means.") + '</div>';
    h += '<h2 style="margin-top:22px">Sleep, last 7 nights</h2><p class="sub">Dashed line: 6 hours. Below it, reaction time tends to slow down.</p>' +
      '<div class="chart">' + sleepChart(x) + '</div></section>';

    // Trend
    h += '<section class="panel span2"><h2>Reaction test since launch</h2>' +
      '<p class="sub">Each dot is one daily test, colored by result. Bands show the limits against ' + esc(x.a.name) + '’s baseline (' + x.a.baseline.mean_rt_ms + ' ms). Bars below count lapses.</p>' +
      '<div class="chart">' + trendChart(x) + '</div>' +
      '<div class="legend"><span><i style="background:rgba(34,197,94,.35)"></i>Ready: up to +10%</span>' +
      '<span><i style="background:rgba(234,179,8,.35)"></i>Caution: +10 to +20%, or 2–3 lapses</span>' +
      '<span><i style="background:rgba(239,68,68,.35)"></i>Not ready: over +20%, or 4+ lapses</span></div></section>';
    h += '</div>';

    $("detail").innerHTML = h;
    var tiles = document.querySelectorAll(".bio");
    for (var i = 0; i < tiles.length; i++) tiles[i].addEventListener("click", function () {
      var k = this.getAttribute("data-k");
      openBio = openBio === k ? null : k;
      renderDetail();
    });
  }

  function timeOf(iso) { try { var d = new Date(iso); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); } catch (e) { return ""; } }
  function alert(kind, icon, text) { return '<div class="alert ' + kind + '">' + icon + '<span>' + esc(text) + '</span></div>'; }
  function figure(v, k, s) { return '<div class="figure"><div class="v">' + v + '</div><div class="k">' + k + '</div><div class="s">' + esc(s) + '</div></div>'; }

  function bioTile(x, k) {
    var t = x.today, lvl = t._bio[k];
    var val = k === "hr" ? t.hr_bpm + "<small>bpm</small>" : k === "spo2" ? t.spo2 + "<small>%</small>" :
      k === "temp" ? t.temp_c.toFixed(1) + "<small>°C</small>" : t.bp_sys + "/" + t.bp_dia + "<small>mmHg</small>";
    var mark = lvl === "ok" ? "✓ " : "⚠ ";
    return '<button class="bio' + (openBio === k ? " open" : "") + '" data-k="' + k + '">' +
      '<div class="top"><span class="name">' + BIO_NAME[k] + '</span><span class="state ' + lvl + '">' + mark + BIO_LABEL[k][lvl] + '</span></div>' +
      '<div class="val">' + val + '</div>' + spark(x, k) + '</button>';
  }

  // ---------- SVG charts (no external libraries) ----------
  function lastN(x, n) { var today = raw.mission.current_day, out = []; for (var d = today - n + 1; d <= today; d++) if (x.byDay[d]) out.push(x.byDay[d]); return out; }

  function spark(x, k) {
    var ds = lastN(x, 7), W = 220, H = 40, pad = 4;
    var series = k === "bp" ? [ds.map(function (d) { return d.bp_sys; }), ds.map(function (d) { return d.bp_dia; })]
      : [ds.map(function (d) { return k === "hr" ? d.hr_bpm : k === "spo2" ? d.spo2 : d.temp_c; })];
    var all = [].concat.apply([], series), lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    if (hi - lo < 1e-6) { hi += 1; lo -= 1; }
    var span = hi - lo; lo -= span * 0.15; hi += span * 0.15;
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">';
    series.forEach(function (vals, si) {
      var pts = vals.map(function (v, i) { return [pad + i * (W - 2 * pad) / (vals.length - 1), H - pad - (v - lo) / (hi - lo) * (H - 2 * pad)]; });
      s += '<polyline fill="none" stroke="' + (si ? "#5f7ea6" : "#7dd3fc") + '" stroke-width="2" stroke-linejoin="round" points="' + pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") + '"/>';
      var lp = pts[pts.length - 1];
      s += '<circle cx="' + lp[0].toFixed(1) + '" cy="' + lp[1].toFixed(1) + '" r="3" fill="' + (si ? "#5f7ea6" : "#7dd3fc") + '"/>';
    });
    return s + '</svg>';
  }

  function sleepChart(x) {
    var ds = lastN(x, 7), W = 560, H = 170, L = 34, R = 10, T = 10, B = 26, max = 9;
    var bw = (W - L - R) / ds.length;
    function y(v) { return T + (1 - v / max) * (H - T - B); }
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Sleep over the last 7 nights">';
    [0, 3, 6, 9].forEach(function (v) {
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#1d3352" stroke-width="1"/>';
      s += '<text class="axis" x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + 'h</text>';
    });
    ds.forEach(function (d, i) {
      var x0 = L + i * bw + bw * 0.2, w = bw * 0.6, short = d.sleep_h < 6;
      s += '<rect x="' + x0.toFixed(1) + '" y="' + y(d.sleep_h).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + (y(0) - y(d.sleep_h)).toFixed(1) + '" rx="5" fill="' + (short ? "#eab308" : "#7dd3fc") + '" opacity="' + (short ? 0.9 : 0.75) + '"><title>Day ' + d.day + ": " + fmtSleep(d.sleep_h) + '</title></rect>';
      s += '<text class="axis" x="' + (x0 + w / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">D' + d.day + '</text>';
    });
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(6) + '" y2="' + y(6) + '" stroke="#eef3fa" stroke-width="1.5" stroke-dasharray="6 5"/>';
    return s + '</svg>';
  }

  function trendChart(x) {
    var ds = x.days.filter(function (d) { return d.day >= 0; });
    var base = x.a.baseline.mean_rt_ms;
    var W = 1180, L = 56, R = 16, T = 12, mainH = 250, gap = 34, lapH = 80, B = 26, H = T + mainH + gap + lapH + B;
    var rts = ds.map(function (d) { return d.test.mean_rt_ms; }).filter(function (v) { return v != null; });
    var lo = Math.min(base * 0.85, Math.min.apply(null, rts) - 10), hi = Math.max(base * 1.32, Math.max.apply(null, rts) + 10);
    var n = ds.length;
    function X(i) { return L + i * (W - L - R) / (n - 1); }
    function Y(v) { return T + (1 - (v - lo) / (hi - lo)) * mainH; }
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Reaction time and lapses per day since launch">';
    // bands
    s += band(Y(Math.min(hi, base * 1.1)), Y(lo), "rgba(34,197,94,0.10)");
    s += band(Y(base * 1.2), Y(base * 1.1), "rgba(234,179,8,0.12)");
    s += band(Y(hi), Y(base * 1.2), "rgba(239,68,68,0.12)");
    function band(y1, y2, fill) { return '<rect x="' + L + '" y="' + y1.toFixed(1) + '" width="' + (W - L - R) + '" height="' + Math.max(0, y2 - y1).toFixed(1) + '" fill="' + fill + '"/>'; }
    // y ticks
    var step = 25, start = Math.ceil(lo / step) * step;
    for (var v = start; v <= hi; v += step) {
      s += '<text class="axis" x="' + (L - 8) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end">' + v + '</text>';
    }
    s += '<text class="axis" x="' + (L - 8) + '" y="' + (T - 0) + '" text-anchor="end" dy="-1">ms</text>';
    // baseline
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(base).toFixed(1) + '" y2="' + Y(base).toFixed(1) + '" stroke="#eef3fa" stroke-width="1.5" stroke-dasharray="7 6"/>';
    s += '<text class="axis" x="' + (W - R - 4) + '" y="' + (Y(base) - 6).toFixed(1) + '" text-anchor="end" style="fill:#eef3fa">baseline ' + base + ' ms</text>';
    // line + dots
    var pts = ds.map(function (d, i) { return d.test.mean_rt_ms == null ? null : [X(i), Y(d.test.mean_rt_ms)]; }).filter(Boolean);
    s += '<polyline fill="none" stroke="#5f7ea6" stroke-width="2" points="' + pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") + '"/>';
    ds.forEach(function (d, i) {
      if (d.test.mean_rt_ms == null) return;
      var isToday = d.day === raw.mission.current_day;
      s += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(d.test.mean_rt_ms).toFixed(1) + '" r="' + (isToday ? 8 : 5.5) + '" fill="' + COLORS[d._color] + '" stroke="#06111f" stroke-width="2">' +
        '<title>Day ' + d.day + ": " + d.test.mean_rt_ms + " ms, " + d.test.lapses + " lapses, " + WORD[d._color] + '</title></circle>';
    });
    // lapses bars
    var lt = T + mainH + gap, maxL = Math.max(6, Math.max.apply(null, ds.map(function (d) { return d.test.lapses; })));
    function LY(v) { return lt + (1 - v / maxL) * lapH; }
    s += '<text class="axis" x="' + (L - 8) + '" y="' + (lt + 4) + '" text-anchor="end">lapses</text>';
    [2, 4].forEach(function (lv) {
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + LY(lv).toFixed(1) + '" y2="' + LY(lv).toFixed(1) + '" stroke="' + (lv === 2 ? "#eab308" : "#ef4444") + '" stroke-opacity="0.55" stroke-dasharray="4 5"/>';
      s += '<text class="axis" x="' + (L - 8) + '" y="' + (LY(lv) + 4).toFixed(1) + '" text-anchor="end">' + lv + '</text>';
    });
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + LY(0) + '" y2="' + LY(0) + '" stroke="#2a4466"/>';
    var bw = (W - L - R) / (n - 1) * 0.55;
    ds.forEach(function (d, i) {
      if (!d.test.lapses) return;
      s += '<rect x="' + (X(i) - bw / 2).toFixed(1) + '" y="' + LY(d.test.lapses).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (LY(0) - LY(d.test.lapses)).toFixed(1) + '" rx="3" fill="' + COLORS[d._color] + '" opacity="0.85"><title>Day ' + d.day + ": " + d.test.lapses + ' lapses</title></rect>';
    });
    // x axis
    ds.forEach(function (d, i) {
      if (d.day % 5 === 0 || d.day === raw.mission.current_day)
        s += '<text class="axis" x="' + X(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + (d.day === raw.mission.current_day ? "Today" : "Day " + d.day) + '</text>';
    });
    return s + '</svg>';
  }

  // ---------- Boot ----------
  function load() {
    fetch("crew.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) { raw = data; build(); render(); })
      .catch(function () {
        var emb = embedded();
        if (emb) { raw = emb; build(); render(); return; }
        $("app").innerHTML = '<div class="error-box"><b>Crew data did not load.</b><br>Start the demo with start_demo.command, or run <code>python3 -m http.server 8000</code> in this folder and open <code>localhost:8000/dashboard.html</code>. The file crew.json must be in the same folder.</div>';
      });
  }
  function refresh() { if (raw) { build(); render(); } }
  window.addEventListener("pageshow", function (e) { if (e.persisted) refresh(); });
  window.addEventListener("storage", function (e) { if (!e.key || e.key.indexOf("selftest_") === 0) refresh(); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
  load();
})();
</script>
</body>
</html>
